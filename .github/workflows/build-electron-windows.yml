name: Build Electron Windows App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'electron/**'
      - '.github/workflows/build-electron-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller scikit-learn

      - name: Build Python app with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --name DeepLiveCum --onedir --windowed run.py `
            --collect-all PySide6 `
            --collect-all cv2 `
            --collect-all onnxruntime `
            --collect-all insightface `
            --collect-all opennsfw2 `
            --collect-all sklearn `
            --collect-all scipy `
            --collect-all numpy `
            --add-data "modules;modules" `
            --add-data "locales;locales" `
            --add-data "media;media" `
            --hidden-import=PySide6.QtCore `
            --hidden-import=PySide6.QtGui `
            --hidden-import=PySide6.QtWidgets `
            --hidden-import=sklearn.cluster `
            --hidden-import=sklearn.utils._cython_blas

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron dependencies
        working-directory: electron
        run: npm install

      - name: Build Electron Windows package
        working-directory: electron
        run: npx electron-builder --win --x64

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Deep-Live-Cum-Windows-${{ github.sha }}
          path: |
            electron/dist/*.exe
            electron/dist/*.zip
            dist/DeepLiveCum
          retention-days: 30
