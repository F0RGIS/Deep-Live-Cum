name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'modules/**'
      - '.github/workflows/build-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk unzip wget curl
          pip install --upgrade pip
          pip install pyside6 buildozer cython

      - name: Download essential models
        run: |
          mkdir -p models
          curl -L -o models/inswapper_128_fp16.onnx \
            "https://huggingface.co/hacksider/deep-live-cam/resolve/main/inswapper_128_fp16.onnx"
          mkdir -p models/buffalo_l/buffalo_l
          for f in 1k3d68.onnx 2d106det.onnx det_10g.onnx genderage.onnx w600k_r50.onnx; do
            curl -L -o "models/buffalo_l/buffalo_l/$f" \
              "https://huggingface.co/hacksider/deep-live-cam/resolve/main/buffalo_l/buffalo_l/$f" || true
          done
          ls -lhR models/ | head -40

      - name: Download PySide6 Android wheels
        run: |
          mkdir -p wheels
          wget -O wheels/pyside.whl \
            "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.8.3-6.8.3-cp311-cp311-android_aarch64.whl"
          wget -O wheels/shiboken.whl \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.8.3-6.8.3-cp311-cp311-android_aarch64.whl"
          ls -lh wheels/

      - name: Build APK with pyside6-android-deploy
        run: |
          if [ -s wheels/pyside.whl ] && [ -s wheels/shiboken.whl ]; then
            pyside6-android-deploy \
              --name DeepLiveCum \
              --wheel-pyside=wheels/pyside.whl \
              --wheel-shiboken=wheels/shiboken.whl \
              --keep-deployment-files || echo "Deploy finished with warnings"
          else
            echo "::warning::PySide6 Android wheels not available."
            exit 1
          fi

      - name: Upload APK and models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeepLiveCum-Android
          path: |
            **/*.apk
            models/
            **/buildozer.spec
          retention-days: 14
          if-no-files-found: ignore
